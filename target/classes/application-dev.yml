# application-dev.yml
server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/titan_tune
    username: titan_user
    password: titan_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: dev-secret-key-change-me-dev-secret-key-change-me-dev-secret-key
  expiration: 86400000

cors:
  allowed-origins: http://localhost:3000,http://localhost:4200,http://localhost:5173

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
    com.titan.tune: DEBUG
    org.springframework.security: DEBUG